name: datasentinel
version: "1.0.0"
config-version: 2
profile: datasentinel

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # calendar range for dim_date
  date_start: "2024-01-01"
  date_end: "2027-12-31"
  # valid_to of the current SCD2 version (same value as HIGH_DATE in 13_silver_lib)
  scd2_high_date: "9999-12-31 00:00:00"
  # amounts closer than this (EUR) count as equal in reconciliation
  recon_tolerance: 0.01
  # reconciliation incidents with at least this much EUR at risk are 'high' severity
  recon_high_amount: 500

models:
  datasentinel:
    +file_format: delta
    gold:
      +schema: gold
      +materialized: table
    recon:
      +schema: recon
      +materialized: table
