[project]
name = "sentinel-dq"
version = "0.1.0"
description = "DataSentinel: telecom data quality rules, PII hashing and SCD2 logic (Python twins of the Databricks notebooks)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
