services:

  # ============================================================
  # PostgreSQL - Source Database (CRM + Billing schemas)
  # ============================================================

  postgres:
    image: postgres:15
    container_name: cdc-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telecom

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    ports:
      - "5432:5432"

    volumes:
      # Init scripts run only the first time, when postgres_data is empty.
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telecom"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - lakehouse


  # ============================================================
  # Kafka - KRaft
  # ============================================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: cdc-kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    ports:
      - "9092:9092"

    volumes:
      # Keeps topics and the Debezium connector across "docker compose down".
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

    networks:
      - lakehouse


  # ============================================================
  # Debezium Kafka Connect
  # ============================================================

  debezium:
    image: quay.io/debezium/connect:2.7
    container_name: cdc-debezium

    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      BOOTSTRAP_SERVERS: kafka:29092

      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

    ports:
      - "8083:8083"

    networks:
      - lakehouse


# ============================================================
# Volumes
# ============================================================

volumes:
  postgres_data:
  kafka_data:


# ============================================================
# Network
# ============================================================

networks:
  lakehouse:
    driver: bridge