
services:
  postgres:
    image: postgres:15
    container_name: cdc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:  postgres
      POSTGRES_DB: telecom
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "5432:5432"        # change to "5433:5432" if 5432 is already used on your PC
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lakehouse

volumes:
  postgres_data:

networks:
  lakehouse:
    driver: bridge
